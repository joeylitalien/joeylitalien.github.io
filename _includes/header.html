<header class="site-header">

  <div class="wrapper">

    <a class="site-title" href="{{ site.baseurl }}/">
      <i class="ti ti-math-integral-x"></i>
      <!-- <img class="site-icon" src="/assets/bunny.svg" alt="Bunny"> -->
        {{ site.title }}
    </a>

    <nav class="site-nav">
      <a href="#" class="menu-icon">
        <svg viewBox="0 0 18 15">
          <rect fill="#ddd" x="0" y="0" width="18" height="3"/>
          <rect fill="#ddd" x="0" y="6" width="18" height="3"/>
          <rect fill="#ddd" x="0" y="12" width="18" height="3"/>
        </svg>
      </a>

      <div class="trigger">
        {% assign pages = site.pages | sort:"order" %}
        {% for p in pages %}
          {% if p.order != -1 %}
            {% if page.url == p.url %}
              <a class="page-link active" href="{{ p.url | prepend: site.baseurl }}">{{ p.title }}</a>
            {% else %}
              <a class="page-link" href="{{ p.url | prepend: site.baseurl }}">{{ p.title }}</a>
            {% endif %}
          {% endif %}
        {% endfor %}
      </div>
    </nav>

  </div>

</header>
